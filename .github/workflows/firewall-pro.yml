name: Application Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Firewall Pro
        run: |
          npm config set registry https://firewall.sonatype.app/npm/
          npm config set //firewall.sonatype.app/npm/:_authToken "${{ secrets.FIREWALL_PRO_TOKEN }}"

      - name: Confirm external dependency route
        run: npm config get registry

      - name: Install approved dependencies
        run: npm install express@5.1.0 lodash@4.17.21

      - name: Install application dependencies
        run: npm install
