name: Application Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure external dependency registry
        run: |
          npm config set registry https://firewall.sonatype.app/npm/
          npm config set //firewall.sonatype.app/npm/:_authToken "${{ secrets.FIREWALL_PRO_TOKEN }}"

      - name: Confirm dependency registry
        run: npm config get registry

      - name: Install dependencies
        run: npm install

      - name: Build complete
        run: echo "Application dependencies installed successfully"
